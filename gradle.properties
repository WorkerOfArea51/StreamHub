# JVM memory for Gradle daemon & Kotlin compiler
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# Enable Gradle build cache (reuses task outputs across invocations)
org.gradle.caching=true

# Enable parallel task execution (helps when more modules are added)
org.gradle.parallel=true

# Kotlin incremental compilation
kotlin.incremental=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin code style
kotlin.code.style=official

# R8 Full Mode optimization
android.enableR8.fullMode=true
