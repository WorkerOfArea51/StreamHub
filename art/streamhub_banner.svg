<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#141926" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#2D3748" stroke-width="1.5" />

  <!-- Ambient Glow Blobs -->
  <circle cx="160" cy="120" r="70" fill="#FF3366" opacity="0.18" filter="url(#logoGlow)" />
  <circle cx="680" cy="60" r="90" fill="#38BDF8" opacity="0.12" filter="url(#logoGlow)" />

  <!-- Logo Icon Group -->
  <g transform="translate(100, 60)">
    <!-- Outer Rounded Hexagon / Shield -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="#1E2230" stroke="url(#logoGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Play Shape with Film Cut -->
    <path d="M48 35L88 60L48 85V35Z" fill="url(#logoGrad)" />
    
    <!-- Neon Waveform Accents -->
    <rect x="24" y="52" width="6" height="16" rx="3" fill="#38BDF8" />
    <rect x="34" y="44" width="6" height="32" rx="3" fill="#FF3366" />
    <rect x="94" y="48" width="6" height="24" rx="3" fill="#FFD700" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(255, 75)">
    <!-- StreamHub Title -->
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="1">
      <tspan fill="#FFFFFF">Stream</tspan><tspan fill="url(#logoGrad)">Hub</tspan>
    </text>



    <!-- Subtitle -->
    <text x="0" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
      Next-Gen Native Android Media Streaming Ecosystem
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 88)">
      <text x="0" y="14" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">
        ⚡ Kotlin 2.0 • 🚀 Jetpack Compose • 🍿 AndroidX Media3 • 🎬 Multi-Arc Creator Studio
      </text>
    </g>
  </g>
</svg>
