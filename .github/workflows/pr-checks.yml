# .github/workflows/pr-checks.yml
#
# Runs on PRs targeting main/master. Verifies that BOTH build types
# compile, including the R8-protected release build. Catches ProGuard
# keep-rule regressions before they ship in a tagged release.
name: PR Checks

on:
  pull_request:
    branches: [ main, master ]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + Debug + Release (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Disable Google Services plugin (no google-services.json in CI)
        run: echo "googleServices.disable=true" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true  # lint failures shouldn't block PRs yet

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned, R8 enabled)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload release mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
          if-no-files-found: ignore
