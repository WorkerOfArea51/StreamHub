# .github/workflows/release.yml
#
# Runs only on tag pushes matching v* (e.g. v2.1.0, v2.1.0-beta1).
# Reads ALL secrets from repository settings, builds a signed release APK,
# and publishes a GitHub Release with the APK attached.
name: Build & Publish Signed Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v2.2.2)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release in progress

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # required to create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore google-services.json
        env:
          GS_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_SECRET" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON repository secret is missing in GitHub repository settings!"
            exit 1
          elif echo "$GS_SECRET" | base64 --decode 2>/dev/null | grep -q "project_info"; then
            echo "$GS_SECRET" | base64 --decode > app/google-services.json
            echo "google-services.json restored from base64 secret ($(wc -c < app/google-services.json) bytes)"
          elif echo "$GS_SECRET" | grep -q "project_info"; then
            echo "$GS_SECRET" > app/google-services.json
            echo "google-services.json restored from raw JSON secret ($(wc -c < app/google-services.json) bytes)"
          else
            echo "::error::Invalid FIREBASE_GOOGLE_SERVICES_JSON secret content"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore
            echo "Keystore restored"
          fi

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > ${{ github.workspace }}/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure local.properties from GitHub Secrets
        run: |
          cat > ${{ github.workspace }}/local.properties <<'EOF'
          streamhub.telegram_api_id=${{ secrets.STREAMHUB_TELEGRAM_API_ID || secrets.TELEGRAM_API_ID }}
          streamhub.telegram_api_hash=${{ secrets.STREAMHUB_TELEGRAM_API_HASH || secrets.TELEGRAM_API_HASH }}
          streamhub.tmdb_api_key=${{ secrets.STREAMHUB_TMDB_API_KEY || secrets.TMDB_API_KEY }}
          streamhub.mal_client_id=${{ secrets.STREAMHUB_MAL_CLIENT_ID || secrets.MAL_CLIENT_ID }}
          streamhub.mal_client_secret=${{ secrets.STREAMHUB_MAL_CLIENT_SECRET || secrets.MAL_CLIENT_SECRET }}
          streamhub.telegram_anime_channel=${{ secrets.STREAMHUB_TELEGRAM_ANIME_CHANNEL || secrets.TELEGRAM_ANIME_CHANNEL }}
          streamhub.telegram_movies_channel=${{ secrets.STREAMHUB_TELEGRAM_MOVIES_CHANNEL || secrets.TELEGRAM_MOVIES_CHANNEL }}
          streamhub.telegram_series_channel=${{ secrets.STREAMHUB_TELEGRAM_SERIES_CHANNEL || secrets.TELEGRAM_SERIES_CHANNEL }}
          streamhub.owner_usernames=${{ secrets.STREAMHUB_OWNER_USERNAMES || secrets.OWNER_USERNAMES }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v4.8.{0}', github.run_number)) }}
          BUILD_NUMBER: ${{ github.run_number }}
          STREAMHUB_TMDB_API_KEY: ${{ secrets.STREAMHUB_TMDB_API_KEY || secrets.TMDB_API_KEY }}
          STREAMHUB_MAL_CLIENT_ID: ${{ secrets.STREAMHUB_MAL_CLIENT_ID || secrets.MAL_CLIENT_ID }}
          STREAMHUB_MAL_CLIENT_SECRET: ${{ secrets.STREAMHUB_MAL_CLIENT_SECRET || secrets.MAL_CLIENT_SECRET }}
          STREAMHUB_TELEGRAM_API_ID: ${{ secrets.STREAMHUB_TELEGRAM_API_ID || secrets.TELEGRAM_API_ID }}
          STREAMHUB_TELEGRAM_API_HASH: ${{ secrets.STREAMHUB_TELEGRAM_API_HASH || secrets.TELEGRAM_API_HASH }}
          STREAMHUB_TELEGRAM_ANIME_CHANNEL: ${{ secrets.STREAMHUB_TELEGRAM_ANIME_CHANNEL || secrets.TELEGRAM_ANIME_CHANNEL }}
          STREAMHUB_TELEGRAM_MOVIES_CHANNEL: ${{ secrets.STREAMHUB_TELEGRAM_MOVIES_CHANNEL || secrets.TELEGRAM_MOVIES_CHANNEL }}
          STREAMHUB_TELEGRAM_SERIES_CHANNEL: ${{ secrets.STREAMHUB_TELEGRAM_SERIES_CHANNEL || secrets.TELEGRAM_SERIES_CHANNEL }}
          STREAMHUB_OWNER_USERNAMES: ${{ secrets.STREAMHUB_OWNER_USERNAMES || secrets.OWNER_USERNAMES }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APKs are signed
        run: |
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            if [ ! -f "$APK_PATH" ]; then
              echo "::error::No release APK found"
              exit 1
            fi
            echo "Verifying: $APK_PATH"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK_PATH" || {
              echo "::error::APK signature verification FAILED for $APK_PATH"
              exit 1
            }
          done

      - name: Generate SHA-256 checksums
        run: |
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            sha256sum "$APK_PATH" > "$APK_PATH.sha256"
            echo "Generated checksum for $(basename $APK_PATH)"
          done

      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v4.8.{0}', github.run_number)) }}
          name: StreamHub ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v4.8.{0}', github.run_number)) }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/StreamHub-arm32-release.apk
            app/build/outputs/apk/release/StreamHub-arm32-release.apk.sha256
            app/build/outputs/apk/release/StreamHub-arm64-release.apk
            app/build/outputs/apk/release/StreamHub-arm64-release.apk.sha256
          draft: false
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temporary credentials
        if: always()
        run: |
          rm -f ${{ github.workspace }}/release.keystore
          rm -f ${{ github.workspace }}/keystore.properties
          rm -f ${{ github.workspace }}/local.properties
