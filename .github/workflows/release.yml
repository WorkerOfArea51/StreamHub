# .github/workflows/release.yml
#
# Runs only on tag pushes matching v* (e.g. v2.1.0, v2.1.0-beta1).
# Reads ALL secrets from repository settings, builds a signed release APK,
# and publishes a GitHub Release with the APK attached.
name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v2.1.0-beta1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release in progress

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # required to create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "google-services.json restored ($(wc -c < app/google-services.json) bytes)"
          else
            echo "FIREBASE_GOOGLE_SERVICES_JSON is empty, using fallback template"
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore
            echo "Keystore restored"
          fi

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > ${{ github.workspace }}/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          STREAMHUB_TMDB_API_KEY: ${{ secrets.STREAMHUB_TMDB_API_KEY }}
          STREAMHUB_MAL_CLIENT_ID: ${{ secrets.STREAMHUB_MAL_CLIENT_ID }}
          STREAMHUB_MAL_CLIENT_SECRET: ${{ secrets.STREAMHUB_MAL_CLIENT_SECRET }}
          STREAMHUB_TELEGRAM_BOT_TOKEN: ${{ secrets.STREAMHUB_TELEGRAM_BOT_TOKEN }}
          STREAMHUB_TELEGRAM_CHANNEL_ID: ${{ secrets.STREAMHUB_TELEGRAM_CHANNEL_ID }}
          STREAMHUB_ADMIN_PIN_HASH: ${{ secrets.STREAMHUB_ADMIN_PIN_HASH }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APKs are signed
        run: |
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            if [ ! -f "$APK_PATH" ]; then
              echo "::error::No release APK found"
              exit 1
            fi
            echo "Verifying: $APK_PATH"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK_PATH" || \
              echo "::warning::APK signature verification failed for $APK_PATH"
          done

      - name: Generate SHA-256 checksums
        run: |
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            sha256sum "$APK_PATH" > "$APK_PATH.sha256"
            echo "Generated checksum for $(basename $APK_PATH)"
          done

      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: StreamHub ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/StreamHub-arm32-release.apk
            app/build/outputs/apk/release/StreamHub-arm32-release.apk.sha256
            app/build/outputs/apk/release/StreamHub-arm64-release.apk
            app/build/outputs/apk/release/StreamHub-arm64-release.apk.sha256
          draft: false
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f ${{ github.workspace }}/release.keystore
          rm -f ${{ github.workspace }}/keystore.properties
