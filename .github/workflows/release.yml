# .github/workflows/release.yml
#
# Runs only on tag pushes matching v* (e.g. v2.1.0, v2.1.0-beta1).
# Reads ALL secrets from repository settings, builds a signed release APK,
# and publishes a GitHub Release with the APK attached.
name: Build & Publish Signed Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v2.2.2)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release in progress

jobs:
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # required to create GitHub Release
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore google-services.json
        env:
          GS_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_SECRET" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON repository secret is missing in GitHub repository settings!"
            exit 1
          elif echo "$GS_SECRET" | base64 --decode 2>/dev/null | grep -q "project_info"; then
            echo "$GS_SECRET" | base64 --decode > app/google-services.json
            echo "google-services.json restored from base64 secret ($(wc -c < app/google-services.json) bytes)"
          elif echo "$GS_SECRET" | grep -q "project_info"; then
            echo "$GS_SECRET" > app/google-services.json
            echo "google-services.json restored from raw JSON secret ($(wc -c < app/google-services.json) bytes)"
          else
            echo "::error::Invalid FIREBASE_GOOGLE_SERVICES_JSON secret content"
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore
            echo "Keystore restored"
          fi

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > ${{ github.workspace }}/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure local.properties from GitHub Secrets
        run: |
          cat > ${{ github.workspace }}/local.properties <<'EOF'
          streamhub.tmdb_api_key=${{ secrets.STREAMHUB_TMDB_API_KEY || secrets.TMDB_API_KEY }}
          streamhub.mal_client_id=${{ secrets.STREAMHUB_MAL_CLIENT_ID || secrets.MAL_CLIENT_ID }}
          streamhub.mal_client_secret=${{ secrets.STREAMHUB_MAL_CLIENT_SECRET || secrets.MAL_CLIENT_SECRET }}
          streamhub.admin_master_password=${{ secrets.STREAMHUB_ADMIN_MASTER_PASSWORD || secrets.ADMIN_MASTER_PASSWORD || '' }}
          streamhub.app_access_code=${{ secrets.STREAMHUB_APP_ACCESS_CODE || secrets.APP_ACCESS_CODE || '' }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Resolve Release Version
        id: release_meta
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            GRADLE_VER=$(grep -E 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${GRADLE_VER:-4.8.337}"
          fi
          BUILD=$(grep -E 'versionCode = ' app/build.gradle.kts | head -n1 | sed -E 's/.*?:[[:space:]]*([0-9]+).*/\1/')
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD:-337}" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: ${TAG} (Version: ${TAG#v}, Build: ${BUILD:-337})"

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.release_meta.outputs.build_number }}
          STREAMHUB_TMDB_API_KEY: ${{ secrets.STREAMHUB_TMDB_API_KEY || secrets.TMDB_API_KEY }}
          STREAMHUB_MAL_CLIENT_ID: ${{ secrets.STREAMHUB_MAL_CLIENT_ID || secrets.MAL_CLIENT_ID }}
          STREAMHUB_MAL_CLIENT_SECRET: ${{ secrets.STREAMHUB_MAL_CLIENT_SECRET || secrets.MAL_CLIENT_SECRET }}
          STREAMHUB_ADMIN_MASTER_PASSWORD: ${{ secrets.STREAMHUB_ADMIN_MASTER_PASSWORD || secrets.ADMIN_MASTER_PASSWORD || '7860' }}
          STREAMHUB_APP_ACCESS_CODE: ${{ secrets.STREAMHUB_APP_ACCESS_CODE || secrets.APP_ACCESS_CODE }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APKs are signed
        run: |
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            if [ ! -f "$APK_PATH" ]; then
              echo "::error::No release APK found"
              exit 1
            fi
            echo "Verifying: $APK_PATH"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK_PATH" || {
              echo "::error::APK signature verification FAILED for $APK_PATH"
              exit 1
            }
          done

      - name: Generate SHA-256 checksums
        run: |
          for APK_PATH in app/build/outputs/apk/release/*.apk; do
            sha256sum "$APK_PATH" > "$APK_PATH.sha256"
            echo "Generated checksum for $(basename $APK_PATH)"
          done

      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhub-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: StreamHub ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/StreamHub-arm32-release.apk
            app/build/outputs/apk/release/StreamHub-arm32-release.apk.sha256
            app/build/outputs/apk/release/StreamHub-arm64-release.apk
            app/build/outputs/apk/release/StreamHub-arm64-release.apk.sha256
            app/build/outputs/apk/release/StreamHub-universal-release.apk
            app/build/outputs/apk/release/StreamHub-universal-release.apk.sha256
          draft: false
          prerelease: ${{ contains(steps.release_meta.outputs.tag_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temporary credentials
        if: always()
        run: |
          rm -f ${{ github.workspace }}/release.keystore
          rm -f ${{ github.workspace }}/keystore.properties
          rm -f ${{ github.workspace }}/local.properties
